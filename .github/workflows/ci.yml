name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json の engines（>=22.18）の下限と、現行の LTS
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --format=github

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # ビルド結果（dist/ の中身）を、そのまま Chrome ウェブストアにアップロードできる形で保存する
      - name: Read extension version
        if: matrix.node-version == 24
        id: manifest
        run: echo "version=$(node -p 'require("./dist/manifest.json").version')" >> "$GITHUB_OUTPUT"

      - name: Upload extension
        if: matrix.node-version == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zetter-font-change-${{ steps.manifest.outputs.version }}
          path: dist/
          if-no-files-found: error
